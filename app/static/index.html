<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GigSaathi – गिग साथी</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>GigSaathi <span lang="hi">गिग साथी</span></h1>
    <p>Earnings, safety, rights, documents, complaints.<br><span lang="hi">कमाई, सुरक्षा, अधिकार, दस्तावेज़, शिकायत।</span></p>
  </header>
  <main>
    <section aria-label="Examples you can tap" id="chips" class="chips"></section>
    <section id="log" role="log" aria-live="polite" aria-label="Conversation"></section>

    <div class="row">
      <label for="city">Your city / आपका शहर</label>
      <select id="city"><option value="">Not selected / चुनें</option></select>
    </div>
    <form id="form" autocomplete="off">
      <label for="msg" class="sr">Your message / आपका संदेश</label>
      <textarea id="msg" rows="2" maxlength="1000" required placeholder="Type or speak / लिखें या बोलें"></textarea>
      <div class="row">
        <select id="voiceLang" aria-label="Voice language / बोलने की भाषा">
          <option value="hi-IN">हिन्दी</option>
          <option value="en-IN">English</option>
        </select>
        <button type="button" id="mic" aria-label="Speak / बोलें">🎤 Speak</button>
        <button type="submit" id="send" class="primary">Send / भेजें</button>
      </div>
      <p id="status" class="sr" aria-live="polite"></p>
    </form>

    <section aria-labelledby="et" class="panel">
      <h2 id="et">My earnings / मेरी कमाई</h2>
      <div class="row">
        <select id="period" aria-label="Period / अवधि">
          <option value="today">Today / आज</option>
          <option value="week">Last 7 days / 7 दिन</option>
          <option value="month">This month / इस महीने</option>
          <option value="all">All time / अब तक</option>
        </select>
        <button type="button" id="refresh">Show / दिखाएँ</button>
      </div>
      <dl id="sum"></dl>
    </section>
  </main>
  <footer><p>Information comes from official sources listed under each answer. Not legal advice.</p></footer>
  <script src="/app.js" defer></script>
</body>
</html>
